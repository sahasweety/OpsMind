server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS resolver.
    # Using a variable in proxy_pass forces Nginx to re-resolve the upstream
    # hostname via DNS on every request instead of caching the IP at startup.
    # This prevents 502 errors when the server container restarts and its IP changes.
    # NOTE: when proxy_pass uses a variable, Nginx forwards the *full* original URI
    # unchanged — so the variable must NOT include a path suffix (no trailing /api/).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend http://server:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        set $backend http://server:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
